site_name: Hatch
site_description: 现代, 可扩展的 Python 项目管理
site_author: Ofek Lev
site_url: https://hellowac.github.io/hatch-zh-cn/
repo_name: hellowac/hatch-zh-cn
repo_url: https://github.com/hellowac/hatch-zh-cn
edit_uri: blob/master/docs
copyright: 'Copyright &copy; Ofek Lev 2017-present'

docs_dir: cn_docs
site_dir: site
theme:
  name: material
  custom_dir: docs/.overrides
  language: zh
  favicon: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github-alt
    logo: material/egg
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky

nav:
  - 首页:
    - 关于: index.md
    - 演练/走查:
      - 安装: install.md
      - 简介: intro.md
      - 环境: environment.md
      - 版本: version.md
      - 构建: build.md
      - 发布: publish.md
    - 学习:
      - 下一步: next-steps.md
      - 为什么选择 Hatch?: why.md
    - 历史:
      - Hatch: history/hatch.md
      - Hatchling: history/hatchling.md
    - 社区:
      - 用户: community/users.md
      - 社区亮点: community/highlights.md
      - 贡献: community/contributing.md
  - 配置:
    - 元数据: config/metadata.md
    - 依赖项: config/dependency.md
    - 构建: config/build.md
    - 环境:
      - 概览: config/environment/overview.md
      - 高级: config/environment/advanced.md
    - 内部:
      - 测试: config/internal/testing.md
      - 静态分析: config/internal/static-analysis.md
      - 构建: config/internal/build.md
    - 上下文格式: config/context.md
    - 项目模板: config/project-templates.md
    - Hatch: config/hatch.md
  - CLI:
    - 关于: cli/about.md
    - 参考: cli/reference.md
  - 插件:
    - 关于: plugins/about.md
    - 构建器:
      - 参考: plugins/builder/reference.md
      - Wheel: plugins/builder/wheel.md
      - 源分发: plugins/builder/sdist.md
      - 二进制: plugins/builder/binary.md
      - 自定义: plugins/builder/custom.md
    - 构建钩子:
      - 参考: plugins/build-hook/reference.md
      - Version: plugins/build-hook/version.md
      - 自定义: plugins/build-hook/custom.md
    - 元数据钩子:
      - 参考: plugins/metadata-hook/reference.md
      - 自定义: plugins/metadata-hook/custom.md
    - 环境:
      - 参考: plugins/environment/reference.md
      - 虚拟: plugins/environment/virtual.md
    - 环境收集器:
      - 参考: plugins/environment-collector/reference.md
      - 自定义: plugins/environment-collector/custom.md
      - 默认: plugins/environment-collector/default.md
    - 发布者:
      - 参考: plugins/publisher/reference.md
      - 索引: plugins/publisher/package-index.md
    - 版本源:
      - 参考: plugins/version-source/reference.md
      - 正则: plugins/version-source/regex.md
      - 代码: plugins/version-source/code.md
      - 环境: plugins/version-source/env.md
    - 版本 scheme:
      - 参考: plugins/version-scheme/reference.md
      - 标准: plugins/version-scheme/standard.md
    - 工具: plugins/utilities.md
  - How-to:
    - Meta:
      - 报告问题: how-to/meta/report-issues.md
    - 集成:
      - VS Code: how-to/integrate/vscode.md
    - 运行:
      - Python 脚本: how-to/run/python-scripts.md
    - 配置:
      - 动态元数据: how-to/config/dynamic-metadata.md
    - 环境:
      - 选择安装程序: how-to/environment/select-installer.md
      - 依赖关系解析: how-to/environment/dependency-resolution.md
    - 静态分析:
      - 自定义行为: how-to/static-analysis/behavior.md
    - Python:
      - 自定义分发: how-to/python/custom.md
    - 发布:
      - 身份认证: how-to/publish/auth.md
      - 仓库选择: how-to/publish/repo.md
    - 插件:
      - 测试构建: how-to/plugins/testing-builds.md
  - 教程:
    - Python:
      - 管理: tutorials/python/manage.md
    - 环境:
      - 基本用法: tutorials/environment/basic-usage.md
    - 测试:
      - 概览: tutorials/testing/overview.md
  - Meta:
    - FAQ: meta/faq.md
    - 作者: meta/authors.md
  - 博客:
    - blog/index.md

watch:
- backend/src/hatchling
- src/hatch

hooks:
- docs/.hooks/plugin_register.py
- docs/.hooks/title_from_content.py

plugins:
  # Enable for bug reports
  # info: {}
  # Built-in
  search: {}
  # Extra
  glightbox: {}
  minify:
    minify_html: true
  git-revision-date-localized:
    type: date
    strict: false
    # Required for blog plugin's generated indices
    fallback_to_build_date: true
    exclude:
      - blog/**/*
  mike:
    alias_type: copy
  mkdocstrings:
    default_handler: python
    handlers:
      python:
        paths:
          - src
        options:
          # Headings
          show_root_heading: true
          show_root_full_path: false
          # Docstrings
          show_if_no_docstring: true
          # Signatures/annotations
          show_signature_annotations: true
          # Other
          show_bases: false
  redirects:
    redirect_maps:
      config/environment.md: config/environment/overview.md
      config/static-analysis.md: config/internal/static-analysis.md
      history.md: history/hatch.md
      how-to/environment/package-indices.md: how-to/environment/dependency-resolution.md
      plugins/builder.md: plugins/builder/reference.md
      plugins/build-hook.md: plugins/build-hook/reference.md
      plugins/metadata-hook.md: plugins/metadata-hook/reference.md
      plugins/environment.md: plugins/environment/reference.md
      plugins/environment-collector.md: plugins/environment-collector/reference.md
      plugins/publisher.md: plugins/publisher/reference.md
      plugins/version-source.md: plugins/version-source/reference.md
      plugins/version-scheme.md: plugins/version-scheme/reference.md
      plugins/builder/app.md: plugins/builder/binary.md
      users.md: community/users.md

markdown_extensions:
  # Built-in
  - markdown.extensions.abbr:
  - markdown.extensions.admonition:
  - markdown.extensions.attr_list:
  - markdown.extensions.footnotes:
  - markdown.extensions.md_in_html:
  - markdown.extensions.meta:
  - markdown.extensions.tables:
  - markdown.extensions.toc:
      permalink: true
  # Extra
  - mkdocs-click:
  - pymdownx.arithmatex:
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret:
  - pymdownx.critic:
  - pymdownx.details:
  - pymdownx.emoji:
      # https://github.com/twitter/twemoji
      # https://raw.githubusercontent.com/facelessuser/pymdown-extensions/master/pymdownx/twemoji_db.py
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      guess_lang: false
      linenums_style: pymdownx-inline
      use_pygments: true
  - pymdownx.inlinehilite:
  - pymdownx.keys:
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
      social_url_shortener: true
      social_url_shorthand: true
      normalize_issue_symbols: true
      provider: github
      user: pypa
      repo: hatch
  - pymdownx.mark:
  - pymdownx.progressbar:
  - pymdownx.saneheaders:
  - pymdownx.smartsymbols:
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - docs/.snippets
      auto_append:
        - links.txt
        - abbrs.txt
  - pymdownx.superfences:
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde:

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/ofek
    - icon: fontawesome/solid/blog
      link: https://ofek.dev/words/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/Ofekmeister
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ofeklev/
extra_css:
  - assets/css/custom.css
  - https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.css
